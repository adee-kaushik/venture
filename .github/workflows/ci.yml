name: VentureLab checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/complete-core-workflows-20261115]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      # Existing repository lockfile has missing transitive Prisma type entries.
      # Resolve the lock before the clean install until the committed lock is regenerated.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm test
      - run: npm run build
